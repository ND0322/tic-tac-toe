<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic-Tac-Toe Starter</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="container">
    <header>
      <h1>Tic-Tac-Toe</h1>
    </header>

    <!-- Game Status & Reset -->
    <section class="status-panel">
      <div id="status-message" class="status-message">Player X's Turn</div>
      <div class = "controls">
        <button id="reset-btn" class="btn">Start Game</button>
        <button id="size-btn" class = "btn">Switch to 4 x 4</button>
        <button id="ai-btn" class = "btn">Play AI</button>
      </div>
    </section>

    <!-- Main Game Board Container -->
    <!-- The 9 grid cells will be dynamically generated by JavaScript! -->
    <main class="board-container">
      <div id="board" class="board">
        <!-- JS will populate cells here -->
      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
